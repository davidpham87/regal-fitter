name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  clojure-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@master
      with:
        cli: 'latest'
    - name: Cache clojure dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
          .cpcache
        key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-
    - name: Run tests
      run: clojure -X:test


  shadow-cljs-compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@master
      with:
        cli: 'latest'
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Cache deps.edn, .shadow-cljs and node modules
      uses: actions/cache@v4
      with:
        path: |
          .shadow-cljs
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
          .cpcache
          node_modules
        key: ${{ runner.os }}-shadow-cljs-${{ hashFiles('deps.edn', 'package-lock.json')}}
        restore-keys: |
          ${{ runner.os }}-shadow-cljs-
    - name: Install npm dependencies
      run: npm ci
    - name: Compile shadow-cljs app
      run: clojure -M:cljs:shadow-cljs compile app
